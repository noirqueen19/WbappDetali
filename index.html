<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ВБшечка Олечки</title><style>body{margin:0;background:#100a20;color:white;font:16px system-ui}header{padding:30px 18px;background:linear-gradient(135deg,#40116b,#bb1e80);text-align:center}h1{margin:0;font-size:30px}main{padding:16px;max-width:680px;margin:auto}button,input{font:inherit;border-radius:14px;padding:14px}button{border:0;color:white;background:#8d2db3;cursor:pointer}input{box-sizing:border-box;width:100%;background:#241b35;color:white;border:1px solid #70478a}section{margin:15px 0}.row{display:flex;gap:8px}.row button{flex:1}.card{background:#231632;border:1px solid #70478a;border-radius:16px;margin:10px 0;padding:15px}.red{background:#c92c55}.green{background:#198653}.muted{opacity:.8}#preview{max-width:100%;max-height:240px;display:none;border-radius:12px}</style><header><h1>💜 ВБшечка Олечки</h1><p>CONTAINER · поиск автозапчастей</p></header><main><section><input id="q" placeholder="Название, номер, штрихкод или 4 цифры"><div class="row" style="margin-top:8px"><button onclick="search()">🔎 ИСКАТЬ</button><button onclick="document.getElementById('photo').click()">📸 СФОТКАТЬ ЦИФРЫ</button></div><input id="photo" type="file" accept="image/*" capture="environment" style="display:none" onchange="ocr(this)"><img id="preview"><p id="status" class="muted"></p></section><section class="row"><button onclick="tab='catalog';render()">Каталог</button><button onclick="tab='signed';render()">Подписанное</button></section><div id="list"></div><p class="muted">Для полного каталога необходим импорт исходных 773 позиций с фотографиями. Данные не удаляются. Подписи в этой версии сохраняются только в этом браузере.</p></main><script>let tab='catalog',items=[],signed=new Set(JSON.parse(localStorage.getItem('signed')||'[]'));function render(){let q=document.getElementById('q').value.trim().toLowerCase();let arr=items.filter(x=>(tab!=='signed'||signed.has(x.id))&&(!q||[x.id,x.name,x.barcode].some(y=>String(y||'').toLowerCase().includes(q))));document.getElementById('list').innerHTML=arr.length?arr.map(x=>'<div class="card">'+(x.photo?'<img style="width:100%;max-height:180px;object-fit:contain" src="'+x.photo+'">':'')+'<h3>№ '+x.id+' · '+x.name+'</h3><p>'+x.barcode+'</p><button class="'+(signed.has(x.id)?'green':'red')+'" onclick="toggle('+x.id+')">'+(signed.has(x.id)?'ПОДПИСАНО':'ПОДПИСАТЬ')+'</button></div>').join(''):'<div class="card">Каталог ещё не загружен. Никаких вымышленных деталей.</div>'}function toggle(n){signed.has(n)?signed.delete(n):signed.add(n);localStorage.setItem('signed',JSON.stringify([...signed]));render()}function search(){tab='catalog';render()}async function ocr(el){let f=el.files[0];if(!f)return;let p=document.getElementById('preview');p.src=URL.createObjectURL(f);p.style.display='block';let s=document.getElementById('status');s.textContent='Распознаю цифры на фото…';try{if(!window.Tesseract){let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';document.head.append(script);await new Promise((ok,no)=>{script.onload=ok;script.onerror=no})}let r=await Tesseract.recognize(f,'eng',{tessedit_char_whitelist:'0123456789'});let v=(r.data.text.match(/\d{4,}/g)||[]).sort((a,b)=>b.length-a.length)[0]||'';document.getElementById('q').value=v.slice(-4);s.textContent=v?'Найдены цифры: '+v+'. Проверь поле поиска.':'Не распознано. Введи последние 4 цифры вручную.';search()}catch(e){s.textContent='Не удалось распознать фото. Введи цифры вручную.'}}fetch('catalog.json').then(r=>r.ok?r.json():[]).then(a=>{items=a;render()}).catch(render);render()</script></html>
